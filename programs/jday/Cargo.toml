[package]
name = "jday"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "jday"

[features]
default = []
no-entrypoint = []

[dependencies]
pinocchio = { version = "=0.11.2", features = ["cpi"] }
pinocchio-system = "=0.6.1"

# Host checks need the curve implementation; SBF uses runtime PDA syscalls.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2.8.0", features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
